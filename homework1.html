<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thomaz's English Quest | Homework 1 Game</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      touch-action: manipulation;
    }
    .font-gaming {
      font-family: 'Orbitron', sans-serif;
    }
    .glow-blue {
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.35);
    }
    .glow-green {
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.4);
    }
    .glow-rose {
      box-shadow: 0 0 25px rgba(244, 63, 94, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-6">

  <!-- HEADER -->
  <header class="max-w-3xl mx-auto w-full flex items-center justify-between py-3 px-4 rounded-2xl bg-slate-900/80 border border-slate-800 backdrop-blur-md mb-6 glow-blue">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center font-gaming text-lg font-black text-white shadow-md">
        H1
      </div>
      <div>
        <h1 class="font-gaming text-sm md:text-base font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-300">
          HOMEWORK 1 CHALLENGE
        </h1>
        <p class="text-xs text-slate-400">10-Stage Interactive Quest</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <a href="index.html" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold font-gaming flex items-center gap-1">
        🏠 Home
      </a>
      <div id="stage-indicator" class="px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30 font-gaming">
        STAGE 1 / 10
      </div>
    </div>
  </header>

  <!-- MAIN GAME CONTAINER -->
  <main class="max-w-3xl mx-auto w-full my-auto">
    
    <!-- GAME SCREEN -->
    <div id="game-card" class="p-6 md:p-8 rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl transition-all">
      <div id="question-category" class="text-xs font-gaming font-bold text-amber-400 uppercase tracking-widest mb-2"></div>
      <h2 id="question-title" class="font-gaming text-xl md:text-2xl font-black text-white mb-6"></h2>

      <!-- OPTIONS CONTAINER -->
      <div id="options-container" class="grid grid-cols-1 gap-3 mb-6">
        <!-- Injected via JS -->
      </div>

      <!-- FEEDBACK MESSAGE -->
      <div id="feedback-box" class="hidden p-4 rounded-2xl text-center font-bold text-sm mb-4 transition-all"></div>
    </div>

    <!-- SUMMARY / ARCHIVE SCREEN (Hidden initially) -->
    <div id="summary-screen" class="hidden p-6 md:p-8 rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl text-center">
      <div class="text-5xl mb-3">🏆</div>
      <h2 class="font-gaming text-2xl font-black text-emerald-400 mb-2">QUEST COMPLETED!</h2>
      <p id="final-score-text" class="text-sm text-slate-300 mb-6 font-gaming font-bold"></p>
      
      <div class="text-left mb-6">
        <h3 class="font-gaming text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Saved Answers Archive (Cloud Synced):</h3>
        <div id="history-list" class="space-y-2 max-h-48 overflow-y-auto p-2 bg-slate-950 rounded-2xl border border-slate-800 text-xs"></div>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
        <button onclick="restartGame()" class="px-6 py-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-black font-gaming text-sm shadow-lg transition-all">
          🔄 PLAY AGAIN
        </button>
        <a href="index.html" class="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold font-gaming text-sm transition-all">
          Back to Portal 🏠
        </a>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="max-w-3xl mx-auto w-full text-center py-3 border-t border-slate-800 text-xs text-slate-500">
    Instructor: skullofenglish • Thomaz Teixeira Learning Suite
  </footer>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    // FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyC2pSWdBIR-aPmpOvaiNzZWGUuCEupxp1c",
      authDomain: "studendtrackerpanel.firebaseapp.com",
      databaseURL: "https://studendtrackerpanel-default-rtdb.firebaseio.com",
      projectId: "studendtrackerpanel",
      storageBucket: "studendtrackerpanel.firebasestorage.app",
      messagingSenderId: "1004678184015",
      appId: "1:1004678184015:web:be965625c08d8ee73ffe3a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const homeworkRef = db.ref("thomaz_quest/homework1_archive");

    // 10 STAGES BASED ON LESSON 1
    const questions = [
      {
        category: "Stage 1: Action Verbs",
        question: "Which sentence correctly describes musical ability?",
        options: ["I can play the drums.", "I can swim the drums.", "I can cook the drums."],
        answer: 0
      },
      {
        category: "Stage 2: Action Verbs",
        question: "If you are in the water, what can you do?",
        options: ["I can run fast.", "I can swim.", "I can read books."],
        answer: 1
      },
      {
        category: "Stage 3: Negative Verbs",
        question: "Complete the negative sentence: 'I ___ cook well.'",
        options: ["can", "can't", "is"],
        answer: 1
      },
      {
        category: "Stage 4: Interests & Hobbies",
        question: "Which of these is a popular game interest hook?",
        options: ["Roblox", "Math homework", "Sleeping"],
        answer: 0
      },
      {
        category: "Stage 5: This or That (Pets)",
        question: "Between Dogs and Cats, how do you express a positive preference?",
        options: ["I hate dogs.", "I like dogs.", "I run dogs."],
        answer: 1
      },
      {
        category: "Stage 6: This or That (Food)",
        question: "If you choose Pizza over Burger, what do you say?",
        options: ["I like pizza.", "I can't pizza.", "Pizza is a drum."],
        answer: 0
      },
      {
        category: "Stage 7: Classroom English",
        question: "What do you say when you don't understand the teacher?",
        options: ["Can I play?", "I don't understand.", "Open the window."],
        answer: 1
      },
      {
        category: "Stage 8: Classroom English",
        question: "If the teacher spoke too fast, what is the polite magic phrase?",
        options: ["Can you repeat, please?", "Stop talking.", "Give me a pen."],
        answer: 0
      },
      {
        category: "Stage 9: Classroom English",
        question: "How do you ask the meaning of a new word in English?",
        options: ["What does ... mean?", "Where is ...?", "How are you?"],
        answer: 0
      },
      {
        category: "Stage 10: Final Wrap-Up",
        question: "Choose the correct sentence structure for what you learned today:",
        options: ["Can I swim can?", "I can speak English.", "Playing I can."],
        answer: 1
      }
    ];

    let currentStage = 0;
    let score = 0;
    let userAnswersLog = [];

    window.onload = () => {
      loadQuestion();
    };

    function loadQuestion() {
      if (currentStage >= questions.length) {
        showSummary();
        return;
      }

      const q = questions[currentStage];
      document.getElementById('stage-indicator.innerText')
      document.getElementById('stage-indicator').innerText = `STAGE ${currentStage + 1} / 10`;
      document.getElementById('question-category').innerText = q.category;
      document.getElementById('question-title').innerText = q.question;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full p-4 rounded-2xl bg-slate-800 hover:bg-slate-750 border border-slate-700 hover:border-amber-500 font-bold text-sm text-left transition-all flex items-center justify-between group";
        btn.innerHTML = `<span>${opt}</span><span class="text-slate-500 group-hover:text-amber-400 transition-colors">➔</span>`;
        btn.onclick = () => selectAnswer(idx);
        container.appendChild(btn);
      });

      document.getElementById('feedback-box').classList.add('hidden');
    }

    function selectAnswer(selectedIndex) {
      const q = questions[currentStage];
      const feedbackBox = document.getElementById('feedback-box');
      feedbackBox.classList.remove('hidden');

      const isCorrect = selectedIndex === q.answer;
      if (isCorrect) {
        score++;
        feedbackBox.className = "p-4 rounded-2xl text-center font-bold text-sm mb-4 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 glow-green";
        feedbackBox.innerText = "🎉 Correct! Awesome job!";
        playAudioTone(600, 150);
      } else {
        feedbackBox.className = "p-4 rounded-2xl text-center font-bold text-sm mb-4 bg-rose-500/20 text-rose-300 border border-rose-500/30 glow-rose";
        feedbackBox.innerText = `❌ Oops! The correct answer was: "${q.options[q.answer]}"`;
        playAudioTone(200, 200);
      }

      // Log answer
      userAnswersLog.push({
        stage: currentStage + 1,
        question: q.question,
        chosen: q.options[selectedIndex],
        correct: q.options[q.answer],
        status: isCorrect ? "Correct" : "Incorrect"
      });

      // Save to Firebase Cloud immediately so archive is updated
      homeworkRef.push({
        timestamp: new Date().toISOString(),
        stage: currentStage + 1,
        question: q.question,
        chosen: q.options[selectedIndex],
        status: isCorrect ? "Correct" : "Incorrect"
      });

      // Wait 1.5 seconds before next stage
      setTimeout(() => {
        currentStage++;
        loadQuestion();
      }, 1600);
    }

    function showSummary() {
      document.getElementById('game-card').classList.add('hidden');
      document.getElementById('summary-screen').classList.remove('hidden');
      document.getElementById('final-score-text').innerText = `You scored ${score} out of 10 correct answers!`;

      confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });

      // Load history archive from Firebase
      homeworkRef.once('value', (snapshot) => {
        const data = snapshot.val();
        const historyContainer = document.getElementById('history-list');
        historyContainer.innerHTML = '';

        if (data) {
          Object.values(data).reverse().forEach(item => {
            const row = document.createElement('div');
            const colorClass = item.status === "Correct" ? "text-emerald-400 bg-emerald-950/30 border-emerald-500/20" : "text-rose-400 bg-rose-950/30 border-rose-500/20";
            row.className = `p-2.5 rounded-xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-1 ${colorClass}`;
            row.innerHTML = `<span><b>Stage ${item.stage}:</b> ${item.question}</span><span class="font-bold">Choice: ${item.chosen} (${item.status})</span>`;
            historyContainer.appendChild(row);
          });
        } else {
          historyContainer.innerHTML = `<p class="text-slate-500 italic p-2">No archive records found yet.</p>`;
        }
      });
    }

    function restartGame() {
      currentStage = 0;
      score = 0;
      userAnswersLog = [];
      document.getElementById('summary-screen').classList.add('hidden');
      document.getElementById('game-card').classList.remove('hidden');
      loadQuestion();
    }

    // Simple Web Audio API sound effect generator (no external audio files needed)
    function playAudioTone(frequency, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = frequency;
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration / 1000);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration / 1000);
      } catch (e) {
        // AudioContext ignored if blocked by browser autoplay policy before first tap
      }
    }
  </script>
</body>
</html>
